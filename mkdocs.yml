site_name: Hired Hands
site_description: Hire vikings to work and guard your Valheim base.
site_url: https://tmac1973.github.io/HiredHands/
repo_url: https://github.com/tmac1973/HiredHands
repo_name: tmac1973/HiredHands
edit_uri: edit/main/docs-site/
docs_dir: docs-site

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Jobs and chests: jobs.md
  - Enhancements: enhancements.md
  - The Woodcutter and the Miner: woodcutter-miner.md
  - The Steward: steward.md
  - The Farmer and the Cook: farmer-cook.md
  - The Rancher: rancher.md
  - Fighting and wizards: combat.md
  - Followers and the Command Stone: followers.md
  - Doors, stairs and ladders: navigation.md
  - Board levels and moving a board: board.md
  - Configuration: configuration.md
  - Other mods: compatibility.md
  - Bug reports and commands: troubleshooting.md
  - Changelog: https://github.com/tmac1973/HiredHands/blob/main/CHANGELOG.md

theme:
  name: material
  logo: icon.png
  favicon: icon.png
  features:
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
