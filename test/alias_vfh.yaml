vfh_t_stance3: vfh_test_begin VFH-STN-3;vfh_fixture hirelings GuardMelee 3;vfh_fixture stance last Passive;vfh_fixture wait 1;vfh_fixture enemies Greyling 1 14;vfh_fixture wait 2;vfh_assert hireling last behaviour != Combat;vfh_assert_eventually 30 hireling last behaviour == Combat;vfh_assert_eventually 60 enemies_alive 30 == 0;vfh_fixture kill_hirelings;vfh_assert log_errors == 0;vfh_test_end
# VFH-STN-4 (SP): a Defensive guard engages an enemy inside its radius and wins.
