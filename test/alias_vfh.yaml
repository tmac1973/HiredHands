# Phase 07 - combat. Open ground, daylight helps (tod 0.5). Enemies spawn around the hireling the test made.
# VFH-STN-1 (SP): a Flee worker runs from a nearby threat.
vfh_t_stance1: vfh_test_begin VFH-STN-1;vfh_fixture hirelings Woodcutter 1;vfh_fixture stance last Flee;vfh_fixture wait 1;vfh_fixture enemies Greyling 2 8;vfh_assert_eventually 10 hireling last behaviour == Flee;vfh_fixture kill_enemies;vfh_fixture kill_hirelings;vfh_assert log_errors == 0;vfh_test_end
# VFH-STN-2 (SP): a Defend worker fights back when something is right on top of it.
vfh_t_stance2: vfh_test_begin VFH-STN-2;vfh_fixture hirelings Miner 3;vfh_fixture enemies Greyling 1 2;vfh_assert_eventually 10 hireling last behaviour == Combat;vfh_assert_eventually 60 enemies_alive 30 == 0;vfh_fixture kill_hirelings;vfh_assert log_errors == 0;vfh_test_end
