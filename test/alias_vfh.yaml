vfh_t_death2: vfh_test_begin VFH-DTH-2;vfh_fixture cfg_set PermadeathEnabled false;vfh_fixture fast_timers on;vfh_fixture base;vfh_fixture board_here;vfh_fixture stock_board 1000 0;vfh_fixture post Woodcutter 1;vfh_assert_eventually 30 roster Active == 1;vfh_assert_eventually 10 posted_hireling present == true;vfh_fixture kill_hirelings;vfh_assert_eventually 10 roster_entry last respawn == true;vfh_assert_eventually 40 roster Active == 1;vfh_assert_eventually 10 posted_hireling present == true;vfh_fixture cfg_set PermadeathEnabled true;vfh_fixture kill_hirelings;vfh_fixture clear_area;vfh_fixture fast_timers off;vfh_assert log_errors == 0;vfh_test_end
# VFH-PRO-1 (SP): promoting charges the difference and re-dresses the hireling (board upgraded to L2 first).
vfh_t_pro1: vfh_test_begin VFH-PRO-1;vfh_fixture fast_timers on;vfh_fixture base;vfh_fixture board_here;vfh_fixture upgrade_mats 2;vfh_fixture upgrade;vfh_assert board_level == 2;vfh_fixture stock_board 1000 100;vfh_fixture post Woodcutter 1;vfh_assert_eventually 30 roster Active == 1;vfh_assert_eventually 10 posted_hireling present == true;vfh_fixture contract promote;vfh_assert last_op == Ok;vfh_assert roster_entry last level == 2;vfh_assert_eventually 5 posted_hireling level == 2;vfh_fixture kill_hirelings;vfh_fixture clear_area;vfh_fixture fast_timers off;vfh_assert log_errors == 0;vfh_test_end
# VFH-DIS-1 (SP): dismissing sends the hireling off and the contract ends once they've gone.
vfh_t_dis1: vfh_test_begin VFH-DIS-1;vfh_fixture fast_timers on;vfh_fixture base;vfh_fixture board_here;vfh_fixture stock_board 400 0;vfh_fixture post Woodcutter 1;vfh_assert_eventually 30 roster Active == 1;vfh_assert_eventually 10 posted_hireling present == true;vfh_fixture contract dismiss;vfh_assert last_op == Ok;vfh_assert_eventually 5 posted_hireling mode == Leaving;vfh_assert_eventually 90 contract_gone last == true;vfh_fixture clear_area;vfh_fixture fast_timers off;vfh_assert log_errors == 0;vfh_test_end

# Phase 07 - combat. Open ground, daylight helps (tod 0.5). Enemies spawn around the hireling the test made.
