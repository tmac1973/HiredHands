# ServerDevcommands aliases (name: command). Commands chain with ';' and can pause with 'wait <ms>'.
# Deployed to the profile's and the dedicated server's BepInEx/config/ on every build / server start.
# vfh_* test commands are cheats: run 'devcommands' first. A row passes when the log says evt=test.result ... pass=true.
vfh_t_smoke: vfh_log_mark smoke;broadcast center HiredHands loaded

# VFH-HARNESS-1: the harness itself and fast_timers (SP; on D you must be in the server's adminlist).
vfh_t_harness1: vfh_test_begin VFH-HARNESS-1;vfh_fixture fast_timers on;vfh_assert fast_timers == true;vfh_assert cfg ArrivalDelayMinSeconds == 5;vfh_assert cfg ReturnMinSeconds == 6;vfh_fixture fast_timers off;vfh_assert cfg ArrivalDelayMinSeconds == 90;vfh_assert data HirelingLevels.3.CargoSlots == 12;vfh_assert log_errors == 0;vfh_test_end

# VFH-CFG-1 (D): server cfg RequiredPieces = 25 and server yml boardLevels level 1 cost Wood = 30, then join and run.
vfh_t_cfg1: vfh_test_begin VFH-CFG-1;vfh_assert data_source == server;vfh_assert cfg RequiredPieces == 25;vfh_assert data BoardLevels.1.Cost.Wood == 30;vfh_assert log_errors == 0;vfh_test_end

# VFH-CFG-2 (SP): run _a, change boardLevels level 1 Wood from 40 to 45 in the yml and save, then run _b.
vfh_t_cfg2_a: vfh_test_begin VFH-CFG-2;vfh_assert data_source == local;vfh_assert data BoardLevels.1.Cost.Wood == 40
vfh_t_cfg2_b: vfh_assert_eventually 10 data BoardLevels.1.Cost.Wood == 45;vfh_assert data_source == local;vfh_assert log_errors == 0;vfh_test_end

# Phase 03 - hiring board. Stand on open, flat-ish ground facing open ground; fixtures build 5-6m ahead of you.
# VFH-PLACE-1 (SP): nothing built nearby.
vfh_t_place1: vfh_test_begin VFH-PLACE-1;vfh_assert_eventually 5 placement_ok == false;vfh_assert_eventually 5 placement_missing == Workbench,Bed,Pieces;vfh_assert log_errors == 0;vfh_test_end
# VFH-PLACE-2 (SP): too few pieces, then each other requirement missing in turn.
vfh_t_place2: vfh_test_begin VFH-PLACE-2;vfh_fixture base_partial pieces;vfh_assert_eventually 5 placement_missing == Pieces;vfh_fixture clear_area;vfh_fixture base_partial bed;vfh_assert_eventually 5 placement_missing == Bed;vfh_fixture clear_area;vfh_fixture base_partial workbench;vfh_assert_eventually 5 placement_missing == Workbench;vfh_fixture clear_area;vfh_assert log_errors == 0;vfh_test_end
# VFH-PLACE-3 (SP): a full base allows a board, which then exists with level 1 and an id.
vfh_t_place3: vfh_test_begin VFH-PLACE-3;vfh_fixture base;vfh_assert_eventually 5 placement_ok == true;vfh_fixture board_here;vfh_assert_eventually 5 boards_near 30 == 1;vfh_assert board_level == 1;vfh_assert_eventually 5 board_count >= 1;vfh_fixture clear_area;vfh_assert log_errors == 0;vfh_test_end
# VFH-PLACE-4 (SP): a second board next to the first is blocked by the distance rule.
vfh_t_place4: vfh_test_begin VFH-PLACE-4;vfh_fixture base;vfh_fixture board_here;vfh_assert_eventually 5 placement_missing == BoardTooClose;vfh_fixture clear_area;vfh_assert log_errors == 0;vfh_test_end
# VFH-STORE-1 (SP): only food and coins go in; raw food only when AllowRawFood is on (default off).
vfh_t_store1: vfh_test_begin VFH-STORE-1;vfh_fixture base;vfh_fixture board_here;vfh_fixture board_put CookedMeat 3;vfh_fixture board_put Coins 25;vfh_fixture board_put RawMeat 2;vfh_fixture board_put Wood 5;vfh_fixture board_put SwordBronze 1;vfh_assert board_items CookedMeat == 3;vfh_assert board_storage coins == 25;vfh_assert board_items RawMeat == 0;vfh_assert board_items Wood == 0;vfh_assert board_items SwordBronze == 0;vfh_assert board_storage food > 0;vfh_assert log_errors == 0;vfh_test_end
# VFH-AZU-1 (SP, AzuAutoStore enabled): the board never enters AzuAutoStore's container list. Leaves the board for _b.
vfh_t_azu1_a: vfh_test_begin VFH-AZU-1;vfh_fixture base;vfh_fixture board_here;vfh_assert_eventually 5 boards_near 30 == 1;vfh_assert azu_sees_board == false
vfh_t_azu1_b: vfh_assert board_items CookedMeat == 0;vfh_assert board_items Wood == 0;vfh_assert azu_sees_board == false;vfh_fixture clear_area;vfh_assert log_errors == 0;vfh_test_end
# VFH-CRAFTY-1 / VFH-PULL-1 (SP, AzuCraftyBoxes + PullMats enabled): see docs/test-checklist.md for the steps between _a and _b.
vfh_t_crafty1_a: vfh_test_begin VFH-CRAFTY-1;vfh_fixture base;vfh_fixture board_here;vfh_fixture crafty_probe;vfh_fixture board_put Coins 5;vfh_fixture board_put CookedMeat 5;vfh_assert crafty_sees_board == false
vfh_t_crafty1_b: vfh_assert board_storage coins == 5;vfh_assert board_items CookedMeat == 5;vfh_fixture clear_area;vfh_assert log_errors == 0;vfh_test_end
vfh_t_pull1_a: vfh_test_begin VFH-PULL-1;vfh_fixture base;vfh_fixture board_here;vfh_fixture board_force_add Wood 20;vfh_assert crafty_sees_board == false
vfh_t_pull1_b: vfh_assert board_items Wood == 20;vfh_fixture clear_area;vfh_assert log_errors == 0;vfh_test_end

# Phase 04 - board upgrades. Open ground; your inventory needs room (each level's mats are added then spent).
# VFH-UPG-1 (SP): L1 to L8 through the real upgrade request, then one more is refused as max.
vfh_t_upg1: vfh_test_begin VFH-UPG-1;vfh_fixture base;vfh_fixture board_here;vfh_assert_eventually 5 board_level == 1;vfh_fixture upgrade_mats 2;vfh_fixture upgrade;vfh_assert upgrade_last == ok;vfh_assert board_level == 2;vfh_fixture upgrade_mats 3;vfh_fixture upgrade;vfh_assert upgrade_last == ok;vfh_assert board_level == 3;vfh_fixture upgrade_mats 4;vfh_fixture upgrade;vfh_assert upgrade_last == ok;vfh_assert board_level == 4;vfh_fixture upgrade_mats 5;vfh_fixture upgrade;vfh_assert upgrade_last == ok;vfh_assert board_level == 5;vfh_fixture upgrade_mats 6;vfh_fixture upgrade;vfh_assert upgrade_last == ok;vfh_assert board_level == 6;vfh_fixture upgrade_mats 7;vfh_fixture upgrade;vfh_assert upgrade_last == ok;vfh_assert board_level == 7;vfh_fixture upgrade_mats 8;vfh_fixture upgrade;vfh_assert upgrade_last == ok;vfh_assert board_level == 8;vfh_fixture upgrade;vfh_assert upgrade_last == max;vfh_assert board_level == 8;vfh_fixture clear_area;vfh_assert log_errors == 0;vfh_test_end
# VFH-UPG-2 (SP): without the materials nothing is spent and the level stays.
vfh_t_upg2: vfh_test_begin VFH-UPG-2;vfh_fixture base;vfh_fixture board_here;vfh_assert_eventually 5 board_level == 1;vfh_fixture upgrade;vfh_assert upgrade_last == missing;vfh_assert board_level == 1;vfh_fixture clear_area;vfh_assert log_errors == 0;vfh_test_end

# Phase 05 - hirelings. Open ground, facing open ground; hirelings appear 4m ahead.
# VFH-HIRE-1 (SP): a hireling's identity, gear and stats survive logout/login. Run _a, log out to the menu and back in, run _b.
vfh_t_hire1_a: vfh_test_begin VFH-HIRE-1;vfh_fixture base;vfh_fixture board_here;vfh_fixture hirelings Miner 4;vfh_assert hireling last job == Miner;vfh_assert hireling last level == 4;vfh_assert hireling last gear.right == PickaxeIron;vfh_assert hireling last gear.chest == ArmorIronChest;vfh_assert hireling last maxhealth == 250;vfh_assert hireling last cargo_slots == 16;vfh_assert hireling last board_id != ""
vfh_t_hire1_b: vfh_assert_eventually 10 hireling_count == 1;vfh_assert hireling last job == Miner;vfh_assert hireling last level == 4;vfh_assert hireling last gear.right == PickaxeIron;vfh_assert hireling last maxhealth == 250;vfh_fixture kill_hirelings;vfh_fixture clear_area;vfh_assert log_errors == 0;vfh_test_end
# VFH-HIRE-3 (SP): gear and stats follow the level tables per job; never tamed, always level 1 as a character, player faction.
vfh_t_hire3: vfh_test_begin VFH-HIRE-3;vfh_fixture hirelings GuardMelee 6;vfh_assert hireling last gear.right == SwordBlackmetal;vfh_assert hireling last gear.left == ShieldBlackmetal;vfh_assert hireling last gear.helmet == HelmetPadded;vfh_assert hireling last maxhealth == 420;vfh_assert hireling last armor > 32;vfh_assert hireling last tamed == false;vfh_assert hireling last charlevel == 1;vfh_assert hireling last faction == Players;vfh_fixture kill_hirelings;vfh_fixture hirelings GuardRanged 3;vfh_assert hireling last gear.left == BowFineWood;vfh_assert hireling last gear.ammo == ArrowBronze;vfh_assert hireling last gear.right == none;vfh_assert hireling last gear.sidearm == Club;vfh_fixture kill_hirelings;vfh_fixture hirelings Woodcutter 1;vfh_assert hireling last gear.right == AxeStone;vfh_assert hireling last gear.chest == ArmorRagsChest;vfh_assert hireling last maxhealth == 80;vfh_fixture kill_hirelings;vfh_assert_eventually 5 hireling_count == 0;vfh_assert log_errors == 0;vfh_test_end
# VFH-HIRE-4 (SP): an L1 hireling's cargo takes only 8 of its 32 slots (light feathers fill the 8, well under the weight
# limit), and heavy wood stops at its 300 weight limit first (3 stacks of 50 at 2 each), with slots to spare.
vfh_t_hire4: vfh_test_begin VFH-HIRE-4;vfh_fixture clear_area 60;vfh_fixture hirelings Woodcutter 1;vfh_fixture cargo_put Feathers 20;vfh_assert hireling last cargo_slots == 8;vfh_assert hireling last cargo_used == 8;vfh_assert hireling last cargo_weight < 300;vfh_fixture kill_hirelings;vfh_fixture hirelings Woodcutter 1;vfh_fixture cargo_put Wood 20;vfh_assert hireling last cargo_used == 3;vfh_assert hireling last cargo.Wood == 150;vfh_assert hireling last cargo_weight <= 300;vfh_fixture kill_hirelings;vfh_assert log_errors == 0;vfh_test_end
# VFH-HIRE-5 (SP): snapshot -> bytes -> destroy -> respawn keeps every value, cargo and health included.
vfh_t_hire5: vfh_test_begin VFH-HIRE-5;vfh_fixture hirelings Smelter 5;vfh_fixture cargo_put Wood 3;vfh_fixture snapshot_test;vfh_assert snapshot_roundtrip == true;vfh_assert hireling last cargo.Wood == 150;vfh_assert hireling last job == Smelter;vfh_fixture kill_hirelings;vfh_assert log_errors == 0;vfh_test_end

# Phase 06 - contracts. Open ground; each builds its own base and board, uses fast timers, and cleans up.
# VFH-CON-1 (SP): post with food only -> fee taken -> viking arrives and works for the board.
vfh_t_con1: vfh_test_begin VFH-CON-1;vfh_fixture fast_timers on;vfh_fixture base;vfh_fixture board_here;vfh_fixture stock_board 400 0;vfh_fixture post Woodcutter 1;vfh_assert last_op == Ok;vfh_assert roster Pending == 1;vfh_assert board_storage food < 400;vfh_assert_eventually 30 roster Active == 1;vfh_assert_eventually 10 posted_hireling present == true;vfh_assert posted_hireling mode == Working;vfh_assert_eventually 5 index last exists == true;vfh_fixture kill_hirelings;vfh_fixture clear_area;vfh_fixture fast_timers off;vfh_assert log_errors == 0;vfh_test_end
# VFH-CON-2 (SP): no funds -> refused; a level 1 board takes 1 guard and 2 workers, and says which cap is full after that.
vfh_t_con2: vfh_test_begin VFH-CON-2;vfh_fixture base;vfh_fixture board_here;vfh_fixture post Woodcutter 1;vfh_assert last_op == InsufficientFunds;vfh_assert roster all == 0;vfh_fixture stock_board 1000 0;vfh_fixture post Woodcutter 1;vfh_fixture post GuardMelee 1;vfh_fixture post Smelter 1;vfh_assert roster Pending == 3;vfh_fixture post Woodcutter 1;vfh_assert last_op == WorkerCapReached;vfh_fixture post GuardRanged 1;vfh_assert last_op == CombatCapReached;vfh_assert roster all == 3;vfh_assert cap_counts == 1/2;vfh_fixture clear_area;vfh_assert log_errors == 0;vfh_test_end
# Split caps (0.7.0). VFH-CAP-1: per-job limits inside the worker cap at board level 3 (2 woodcutters, 1 Steward).
vfh_t_cap1: vfh_test_begin VFH-CAP-1;vfh_fixture caps reset;vfh_fixture base;vfh_fixture board_here;vfh_fixture board_level 3;vfh_fixture stock_board 1000 0;vfh_fixture post Woodcutter 1;vfh_fixture post Woodcutter 1;vfh_assert last_op == Ok;vfh_fixture post Woodcutter 1;vfh_assert last_op == JobLimitReached;vfh_fixture post Smelter 1;vfh_assert last_op == Ok;vfh_fixture post Smelter 1;vfh_assert last_op == JobLimitReached;vfh_assert cap_counts == 0/3;vfh_fixture clear_area;vfh_assert log_errors == 0;vfh_test_end
# VFH-CAP-2: one guard at level 1; a second comes with the level 3 upgrade.
vfh_t_cap2: vfh_test_begin VFH-CAP-2;vfh_fixture caps reset;vfh_fixture base;vfh_fixture board_here;vfh_fixture stock_board 1000 0;vfh_fixture post GuardMelee 1;vfh_assert last_op == Ok;vfh_fixture post GuardMelee 1;vfh_assert last_op == CombatCapReached;vfh_fixture board_level 3;vfh_fixture post GuardMelee 1;vfh_assert last_op == Ok;vfh_assert cap_counts == 2/0;vfh_fixture clear_area;vfh_assert log_errors == 0;vfh_test_end
# VFH-CAP-3: a board already over its combat cap (cap lowered to 1 after hiring 2) keeps both guards and refuses a third; workers unaffected.
vfh_t_cap3: vfh_test_begin VFH-CAP-3;vfh_fixture caps reset;vfh_fixture base;vfh_fixture board_here;vfh_fixture board_level 3;vfh_fixture stock_board 1000 0;vfh_fixture post GuardMelee 1;vfh_fixture post GuardMelee 1;vfh_assert roster all == 2;vfh_fixture caps 3 1 6;vfh_assert roster all == 2;vfh_fixture post GuardRanged 1;vfh_assert last_op == CombatCapReached;vfh_fixture post Woodcutter 1;vfh_assert last_op == Ok;vfh_fixture caps reset;vfh_fixture clear_area;vfh_assert log_errors == 0;vfh_test_end
# VFH-CAP-4: the job gates still apply: no miner at level 1.
vfh_t_cap4: vfh_test_begin VFH-CAP-4;vfh_fixture base;vfh_fixture board_here;vfh_fixture stock_board 1000 0;vfh_fixture post Miner 1;vfh_assert last_op == BadLevel;vfh_assert roster all == 0;vfh_fixture clear_area;vfh_assert log_errors == 0;vfh_test_end
# VFH-CAP-5: CombatHirelings off: guards are refused (CombatOff), workers still hired.
vfh_t_cap5: vfh_test_begin VFH-CAP-5;vfh_fixture caps reset;vfh_fixture cfg_set CombatHirelings false;vfh_fixture base;vfh_fixture board_here;vfh_fixture stock_board 1000 0;vfh_fixture post GuardMelee 1;vfh_assert last_op == CombatOff;vfh_fixture post GuardRanged 1;vfh_assert last_op == CombatOff;vfh_fixture post Woodcutter 1;vfh_assert last_op == Ok;vfh_assert cap_counts == 0/1;vfh_fixture cfg_set CombatHirelings true;vfh_fixture clear_area;vfh_assert log_errors == 0;vfh_test_end
# VFH-CHARTER-1: moving a board: deconstructing a level 3 board packs its woodcutter and guard into the Hiring Charter
# (they vanish); a new board placed with it is level 3 and both walk back in.
vfh_t_charter1: vfh_test_begin VFH-CHARTER-1;vfh_fixture caps reset;vfh_fixture fast_timers on;vfh_fixture base;vfh_fixture board_here;vfh_fixture board_level 3;vfh_fixture stock_board 400 0;vfh_fixture post Woodcutter 1;vfh_fixture post GuardMelee 1;vfh_assert_eventually 30 roster Active == 2;vfh_assert_eventually 10 hireling_count == 2;vfh_fixture charter_pack;vfh_assert_eventually 10 hireling_count == 0;vfh_assert charter_carries == 2;vfh_assert boards_near 50 == 0;vfh_fixture board_here;vfh_fixture charter_apply;vfh_assert board_level == 3;vfh_assert charter_carries == 0;vfh_assert roster all == 2;vfh_assert_eventually 40 roster Active == 2;vfh_assert_eventually 10 hireling_count == 2;vfh_fixture kill_hirelings;vfh_fixture clear_area;vfh_fixture fast_timers off;vfh_assert log_errors == 0;vfh_test_end
# VFH-CON-3 (SP): cancelling a pending contract gives the fee back.
vfh_t_con3: vfh_test_begin VFH-CON-3;vfh_fixture base;vfh_fixture board_here;vfh_fixture stock_board 400 0;vfh_fixture post Woodcutter 1;vfh_assert roster Pending == 1;vfh_fixture contract cancel;vfh_assert last_op == Ok;vfh_assert roster all == 0;vfh_assert board_storage food >= 400;vfh_fixture clear_area;vfh_assert log_errors == 0;vfh_test_end
# VFH-UPK-1 (SP): an unpaid hireling counts 1, 2 days, then quits on the 3rd and walks off.
vfh_t_upk1: vfh_test_begin VFH-UPK-1;vfh_fixture fast_timers on;vfh_fixture base;vfh_fixture board_here;vfh_fixture stock_board 160 0;vfh_fixture post Woodcutter 1;vfh_assert_eventually 30 roster Active == 1;vfh_fixture board_clear;vfh_fixture skip_days 1;vfh_assert roster_entry last unpaid == 1;vfh_fixture skip_days 1;vfh_assert roster_entry last unpaid == 2;vfh_fixture skip_days 1;vfh_assert roster_entry last state == Leaving;vfh_assert_eventually 90 contract_gone last == true;vfh_fixture clear_area;vfh_fixture fast_timers off;vfh_assert log_errors == 0;vfh_test_end
# VFH-UPK-2 (SP): a paid day keeps them working and records the day.
